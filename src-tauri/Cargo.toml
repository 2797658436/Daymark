[package]
name = "daymark"
version = "0.1.15"
description = "Daymark local-first planning desktop app"
authors = ["Daymark contributors"]
edition = "2024"

[lib]
name = "daymark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "daymark"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 这一行不是「没人用的构建依赖」，不要当垃圾清理（`src/lib/nativeBuildConfig.test.ts` 盯着它）。
#
# `indexmap 1.9.3` 是 schemars 0.8 的构建期依赖（tauri-build → tauri-utils → schemars）。
# 它自己的 build.rs 会在 `CARGO_FEATURE_STD` 未设置时用 autocfg **探测**目标是否带 std；
# 探测一旦失败，编译出的 `IndexMap<K, V, S>` 就没有 `S` 的默认值，而 schemars 写的是
# `indexmap::IndexMap<K, V>`，于是整个原生层以 `error[E0107]` 编译失败（rustc/cargo 1.97.1
# 可稳定复现，删掉 target 缓存也一样）。显式启用 `std` 会让那个 build.rs 走
# `autocfg::emit("has_std")` 分支、完全跳过探测。
indexmap = { version = "1.9", features = ["std"] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
# 开机自启动。**钉在 2.5.x**：2.6+ 要求 Tauri ≥2.12，会把 tauri／wry 整条原生依赖从 2.11.5
# 抬上去；升级插件时要单独评估原生依赖链，不要顺手改成 "2"。JS 侧同样停在 2.5.1。
tauri-plugin-autostart = "~2.5.1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
